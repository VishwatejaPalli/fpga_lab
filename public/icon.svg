<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Silicon Die Gradient -->
    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b33" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>

    <!-- Pin Gradient -->
    <linearGradient id="pinGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="pinGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Core Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Chip Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyan/Blue Ambient Glow -->
  <rect x="76" y="76" width="360" height="360" rx="52" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.3" filter="url(#glow)" />

  <!-- IC Lead Frame Pins (4 per side) -->
  <!-- Top Pins -->
  <g fill="url(#pinGradV)">
    <rect x="148" y="34" width="24" height="52" rx="5" />
    <rect x="212" y="34" width="24" height="52" rx="5" />
    <rect x="276" y="34" width="24" height="52" rx="5" />
    <rect x="340" y="34" width="24" height="52" rx="5" />
  </g>

  <!-- Bottom Pins -->
  <g fill="url(#pinGradV)">
    <rect x="148" y="426" width="24" height="52" rx="5" />
    <rect x="212" y="426" width="24" height="52" rx="5" />
    <rect x="276" y="426" width="24" height="52" rx="5" />
    <rect x="340" y="426" width="24" height="52" rx="5" />
  </g>

  <!-- Left Pins -->
  <g fill="url(#pinGradH)">
    <rect x="34" y="148" width="52" height="24" rx="5" />
    <rect x="34" y="212" width="52" height="24" rx="5" />
    <rect x="34" y="276" width="52" height="24" rx="5" />
    <rect x="34" y="340" width="52" height="24" rx="5" />
  </g>

  <!-- Right Pins -->
  <g fill="url(#pinGradH)">
    <rect x="426" y="148" width="52" height="24" rx="5" />
    <rect x="426" y="212" width="52" height="24" rx="5" />
    <rect x="426" y="276" width="52" height="24" rx="5" />
    <rect x="426" y="340" width="52" height="24" rx="5" />
  </g>

  <!-- Main IC Package Body -->
  <rect x="80" y="80" width="352" height="352" rx="46" fill="url(#chipGrad)" stroke="#3b82f6" stroke-width="7" />

  <!-- Bevel Ring -->
  <rect x="94" y="94" width="324" height="324" rx="36" fill="none" stroke="#1e293b" stroke-width="4" opacity="0.8" />

  <!-- Pin 1 Dot Indicator -->
  <circle cx="120" cy="120" r="12" fill="#090d1a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="120" cy="120" r="6" fill="#10b981" filter="url(#coreGlow)" />

  <!-- Silicon Logic Die -->
  <rect x="156" y="156" width="200" height="200" rx="24" fill="url(#dieGrad)" stroke="#1d4ed8" stroke-width="4" />

  <!-- Logic Fabric Grid Lines -->
  <g stroke="#1e3a8a" stroke-width="2.5" opacity="0.6">
    <line x1="172" y1="206" x2="340" y2="206" />
    <line x1="172" y1="256" x2="340" y2="256" />
    <line x1="172" y1="306" x2="340" y2="306" />
    <line x1="206" y1="172" x2="206" y2="340" />
    <line x1="256" y1="172" x2="256" y2="340" />
    <line x1="306" y1="172" x2="306" y2="340" />
  </g>

  <!-- Corner Silicon Vias / Matrix Nodes -->
  <g>
    <circle cx="206" cy="206" r="4.5" fill="#10b981" />
    <circle cx="206" cy="206" r="2" fill="#ffffff" />
    <circle cx="306" cy="206" r="4.5" fill="#38bdf8" />
    <circle cx="306" cy="206" r="2" fill="#ffffff" />
    <circle cx="206" cy="306" r="4.5" fill="#38bdf8" />
    <circle cx="206" cy="306" r="2" fill="#ffffff" />
    <circle cx="306" cy="306" r="4.5" fill="#10b981" />
    <circle cx="306" cy="306" r="2" fill="#ffffff" />
  </g>

  <!-- Central Electric Core / Lightning Bolt -->
  <!-- Outer Bolt Bloom -->
  <polygon points="268,172 208,260 258,260 238,340 304,248 254,248" fill="#38bdf8" opacity="0.4" filter="url(#coreGlow)" />
  <!-- Main Bolt -->
  <polygon points="268,172 208,260 258,260 238,340 304,248 254,248" fill="url(#boltGrad)" />
  <!-- Inner White Lightning Core -->
  <polyline points="265,186 228,252 272,252 246,318" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
