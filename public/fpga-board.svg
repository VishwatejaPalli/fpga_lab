    <!-- Chip label -->
    <text x="60" y="48" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#4a9eda">XILINX</text>
    <text x="60" y="63" text-anchor="middle" font-family="monospace" font-size="10" fill="#6ab4f0">Artix-7</text>
    <text x="60" y="78" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">XC7A35T</text>
    <!-- Die shadow / center detail -->
    <rect x="20" y="85" width="80" height="22" rx="3" fill="#222" stroke="#555" stroke-width="0.5"/>
    <text x="60" y="100" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">FPGA</text>
    <!-- Ball pins along edges -->
    <g fill="#aaa">
      <rect x="-4" y="12" width="6" height="4" rx="1"/>
      <rect x="-4" y="24" width="6" height="4" rx="1"/>
      <rect x="-4" y="36" width="6" height="4" rx="1"/>
      <rect x="-4" y="48" width="6" height="4" rx="1"/>
      <rect x="-4" y="60" width="6" height="4" rx="1"/>
      <rect x="-4" y="72" width="6" height="4" rx="1"/>
      <rect x="-4" y="84" width="6" height="4" rx="1"/>
      <rect x="-4" y="96" width="6" height="4" rx="1"/>
      <rect x="118" y="12" width="6" height="4" rx="1"/>
      <rect x="118" y="24" width="6" height="4" rx="1"/>
      <rect x="118" y="36" width="6" height="4" rx="1"/>
      <rect x="118" y="48" width="6" height="4" rx="1"/>
      <rect x="118" y="60" width="6" height="4" rx="1"/>
      <rect x="118" y="72" width="6" height="4" rx="1"/>
      <rect x="118" y="84" width="6" height="4" rx="1"/>
      <rect x="118" y="96" width="6" height="4" rx="1"/>
      <rect x="12" y="-4" width="4" height="6" rx="1"/>
      <rect x="24" y="-4" width="4" height="6" rx="1"/>
      <rect x="36" y="-4" width="4" height="6" rx="1"/>
      <rect x="48" y="-4" width="4" height="6" rx="1"/>
      <rect x="60" y="-4" width="4" height="6" rx="1"/>
      <rect x="72" y="-4" width="4" height="6" rx="1"/>
      <rect x="84" y="-4" width="4" height="6" rx="1"/>
      <rect x="96" y="-4" width="4" height="6" rx="1"/>
      <rect x="12" y="118" width="4" height="6" rx="1"/>
      <rect x="24" y="118" width="4" height="6" rx="1"/>
      <rect x="36" y="118" width="4" height="6" rx="1"/>
      <rect x="48" y="118" width="4" height="6" rx="1"/>
      <rect x="60" y="118" width="4" height="6" rx="1"/>
      <rect x="72" y="118" width="4" height="6" rx="1"/>
      <rect x="84" y="118" width="4" height="6" rx="1"/>
      <rect x="96" y="118" width="4" height="6" rx="1"/>
    </g>
  </g>

  <!-- ===== Configuration Flash Memory ===== -->
  <g transform="translate(130, 240)">
    <rect width="52" height="28" rx="4" fill="#222" stroke="#555" stroke-width="1.5"/>
    <text x="26" y="12" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">FLASH</text>
    <text x="26" y="22" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">128Mb</text>
    <g fill="#888">
