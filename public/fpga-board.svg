      <rect x="-3" y="11" width="5" height="3" rx="1"/>
      <rect x="-3" y="18" width="5" height="3" rx="1"/>
      <rect x="50" y="4" width="5" height="3" rx="1"/>
      <rect x="50" y="11" width="5" height="3" rx="1"/>
      <rect x="50" y="18" width="5" height="3" rx="1"/>
    </g>
  </g>

  <!-- ===== USB-JTAG Programmer chip ===== -->
  <g transform="translate(40, 100)">
    <rect width="56" height="46" rx="4" fill="#111" stroke="#444" stroke-width="1.5"/>
    <text x="28" y="18" text-anchor="middle" font-family="monospace" font-size="7" fill="#aaa">USB-JTAG</text>
    <text x="28" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">FT2232</text>
    <g fill="#888">
      <rect x="-3" y="8" width="5" height="3" rx="1"/>
      <rect x="-3" y="16" width="5" height="3" rx="1"/>
      <rect x="-3" y="24" width="5" height="3" rx="1"/>
      <rect x="-3" y="32" width="5" height="3" rx="1"/>
      <rect x="54" y="8" width="5" height="3" rx="1"/>
      <rect x="54" y="16" width="5" height="3" rx="1"/>
      <rect x="54" y="24" width="5" height="3" rx="1"/>
      <rect x="54" y="32" width="5" height="3" rx="1"/>
    </g>
  </g>

  <!-- ===== USB Connector (left edge) ===== -->
  <g transform="translate(0, 155)">
    <rect width="22" height="36" rx="2" fill="#c0c0c0" stroke="#888" stroke-width="1.5"/>
    <rect x="4" y="5" width="14" height="26" rx="1" fill="#666"/>
    <text x="11" y="45" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#aaa">USB</text>
  </g>

  <!-- ===== Power Jack (left edge) ===== -->
  <g transform="translate(0, 220)">
    <rect width="22" height="28" rx="2" fill="#333" stroke="#666" stroke-width="1.5"/>
    <circle cx="11" cy="14" r="6" fill="#111" stroke="#555" stroke-width="1"/>
    <circle cx="11" cy="14" r="2.5" fill="#888"/>
    <text x="11" y="37" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#aaa">PWR</text>
  </g>

  <!-- ===== PMOD Connectors (right side) ===== -->
  <g transform="translate(458, 60)">
    <rect width="22" height="80" rx="2" fill="#111" stroke="#555" stroke-width="1.5"/>
    <g fill="#777">
      <circle cx="11" cy="10" r="3"/>
      <circle cx="11" cy="22" r="3"/>
      <circle cx="11" cy="34" r="3"/>
      <circle cx="11" cy="46" r="3"/>
      <circle cx="11" cy="58" r="3"/>
      <circle cx="11" cy="70" r="3"/>
    </g>
    <text x="11" y="-5" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#aaa">PMOD</text>
  </g>
  <g transform="translate(458, 155)">
    <rect width="22" height="80" rx="2" fill="#111" stroke="#555" stroke-width="1.5"/>
    <g fill="#777">
      <circle cx="11" cy="10" r="3"/>
      <circle cx="11" cy="22" r="3"/>
      <circle cx="11" cy="34" r="3"/>
      <circle cx="11" cy="46" r="3"/>
      <circle cx="11" cy="58" r="3"/>
      <circle cx="11" cy="70" r="3"/>
    </g>
    <text x="11" y="-5" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#aaa">PMOD</text>
  </g>

  <!-- ===== VGA Connector (right side) ===== -->
  <g transform="translate(440, 250)">
    <rect width="40" height="30" rx="2" fill="#444" stroke="#777" stroke-width="1.5"/>
    <g fill="#888">
      <circle cx="8" cy="8" r="2.5"/>
      <circle cx="20" cy="8" r="2.5"/>
      <circle cx="32" cy="8" r="2.5"/>
      <circle cx="8" cy="16" r="2.5"/>
      <circle cx="20" cy="16" r="2.5"/>
      <circle cx="32" cy="16" r="2.5"/>
      <circle cx="8" cy="24" r="2.5"/>
      <circle cx="20" cy="24" r="2.5"/>
      <circle cx="32" cy="24" r="2.5"/>
    </g>
    <text x="20" y="40" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#aaa">VGA</text>
  </g>

  <!-- ===== Push Buttons ===== -->
  <g transform="translate(300, 60)">
    <text x="30" y="-5" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8ab">BUTTONS</text>
    <circle cx="10" cy="10" r="8" fill="#2255aa" stroke="#4488dd" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="4" fill="#3366cc"/>
    <circle cx="30" cy="10" r="8" fill="#2255aa" stroke="#4488dd" stroke-width="1.5"/>
    <circle cx="30" cy="10" r="4" fill="#3366cc"/>
    <circle cx="50" cy="10" r="8" fill="#aa2222" stroke="#dd4444" stroke-width="1.5"/>
    <circle cx="50" cy="10" r="4" fill="#cc3333"/>
  </g>

  <!-- ===== LEDs ===== -->
  <g transform="translate(290, 110)">
    <text x="50" y="-5" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8ab">LEDs</text>
    <!-- 8 LEDs with glow effect -->
    <g>
      <!-- LED 1 - green (on) -->
      <circle cx="8" cy="10" r="5" fill="#00cc00" opacity="0.3"/>
      <circle cx="8" cy="10" r="3.5" fill="#00ff00"/>
      <!-- LED 2 - green (on) -->
      <circle cx="22" cy="10" r="5" fill="#00cc00" opacity="0.3"/>
      <circle cx="22" cy="10" r="3.5" fill="#00ff00"/>
      <!-- LED 3 - green (dim) -->
      <circle cx="36" cy="10" r="3.5" fill="#004400"/>
      <!-- LED 4 - green (on) -->
      <circle cx="50" cy="10" r="5" fill="#00cc00" opacity="0.3"/>
      <circle cx="50" cy="10" r="3.5" fill="#00ff00"/>
      <!-- LED 5 - yellow (on) -->
      <circle cx="64" cy="10" r="5" fill="#ccaa00" opacity="0.3"/>
      <circle cx="64" cy="10" r="3.5" fill="#ffcc00"/>
      <!-- LED 6 - green (dim) -->
      <circle cx="78" cy="10" r="3.5" fill="#004400"/>
      <!-- LED 7 - red (on) -->
      <circle cx="92" cy="10" r="5" fill="#cc0000" opacity="0.3"/>
      <circle cx="92" cy="10" r="3.5" fill="#ff2222"/>
      <!-- LED 8 - green (on) -->
      <circle cx="106" cy="10" r="5" fill="#00cc00" opacity="0.3"/>
      <circle cx="106" cy="10" r="3.5" fill="#00ff00"/>
    </g>
  </g>

  <!-- ===== DIP Switches ===== -->
  <g transform="translate(290, 145)">
    <rect width="110" height="26" rx="3" fill="#111" stroke="#444" stroke-width="1.5"/>
    <text x="55" y="-4" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#8ab">SWITCHES</text>
    <g>
      <rect x="4" y="4" width="12" height="18" rx="2" fill="#222" stroke="#555" stroke-width="1"/>
      <rect x="5" y="5" width="10" height="8" rx="1" fill="#cc2222"/>
      <rect x="18" y="4" width="12" height="18" rx="2" fill="#222" stroke="#555" stroke-width="1"/>
      <rect x="19" y="13" width="10" height="8" rx="1" fill="#555"/>
      <rect x="32" y="4" width="12" height="18" rx="2" fill="#222" stroke="#555" stroke-width="1"/>
      <rect x="33" y="5" width="10" height="8" rx="1" fill="#cc2222"/>
      <rect x="46" y="4" width="12" height="18" rx="2" fill="#222" stroke="#555" stroke-width="1"/>
      <rect x="47" y="13" width="10" height="8" rx="1" fill="#555"/>
      <rect x="60" y="4" width="12" height="18" rx="2" fill="#222" stroke="#555" stroke-width="1"/>
      <rect x="61" y="13" width="10" height="8" rx="1" fill="#555"/>
      <rect x="74" y="4" width="12" height="18" rx="2" fill="#222" stroke="#555" stroke-width="1"/>
      <rect x="75" y="5" width="10" height="8" rx="1" fill="#cc2222"/>
      <rect x="88" y="4" width="12" height="18" rx="2" fill="#222" stroke="#555" stroke-width="1"/>
      <rect x="89" y="13" width="10" height="8" rx="1" fill="#555"/>
    </g>
  </g>

  <!-- ===== Seven-Segment Display (4-digit) ===== -->
  <g transform="translate(295, 185)">
    <rect width="130" height="58" rx="4" fill="#0a0a0a" stroke="#333" stroke-width="1.5"/>
    <text x="65" y="-4" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#8ab">7-SEG DISPLAY</text>
    <!-- Digit 1 -->
    <g fill="#cc4400" opacity="0.25">
      <rect x="8" y="8" width="22" height="4" rx="2"/>
      <rect x="8" y="26" width="22" height="4" rx="2"/>
      <rect x="8" y="44" width="22" height="4" rx="2"/>
      <rect x="8" y="8" width="4" height="22" rx="2"/>
      <rect x="26" y="8" width="4" height="22" rx="2"/>
      <rect x="8" y="26" width="4" height="22" rx="2"/>
      <rect x="26" y="26" width="4" height="22" rx="2"/>
    </g>
    <g fill="#ff6600">
      <rect x="8" y="8" width="22" height="4" rx="2"/>
      <rect x="26" y="8" width="4" height="22" rx="2"/>
      <rect x="26" y="26" width="4" height="22" rx="2"/>
      <rect x="8" y="44" width="22" height="4" rx="2"/>
    </g>
    <!-- Digit 2 -->
    <g fill="#cc4400" opacity="0.25">
      <rect x="40" y="8" width="22" height="4" rx="2"/>
      <rect x="40" y="26" width="22" height="4" rx="2"/>
      <rect x="40" y="44" width="22" height="4" rx="2"/>
      <rect x="40" y="8" width="4" height="22" rx="2"/>
      <rect x="58" y="8" width="4" height="22" rx="2"/>
      <rect x="40" y="26" width="4" height="22" rx="2"/>
      <rect x="58" y="26" width="4" height="22" rx="2"/>
    </g>
    <g fill="#ff6600">
      <rect x="40" y="8" width="22" height="4" rx="2"/>
      <rect x="40" y="26" width="22" height="4" rx="2"/>
      <rect x="40" y="44" width="22" height="4" rx="2"/>
      <rect x="40" y="8" width="4" height="22" rx="2"/>
      <rect x="40" y="26" width="4" height="22" rx="2"/>
      <rect x="58" y="8" width="4" height="22" rx="2"/>
    </g>
    <!-- Digit 3 -->
    <g fill="#cc4400" opacity="0.25">
      <rect x="72" y="8" width="22" height="4" rx="2"/>
      <rect x="72" y="26" width="22" height="4" rx="2"/>
      <rect x="72" y="44" width="22" height="4" rx="2"/>
      <rect x="72" y="8" width="4" height="22" rx="2"/>
      <rect x="90" y="8" width="4" height="22" rx="2"/>
      <rect x="72" y="26" width="4" height="22" rx="2"/>
      <rect x="90" y="26" width="4" height="22" rx="2"/>
    </g>
    <g fill="#ff6600">
      <rect x="72" y="8" width="22" height="4" rx="2"/>
      <rect x="72" y="26" width="22" height="4" rx="2"/>
      <rect x="90" y="8" width="4" height="22" rx="2"/>
      <rect x="90" y="26" width="4" height="22" rx="2"/>
      <rect x="72" y="44" width="22" height="4" rx="2"/>
    </g>
    <!-- Digit 4 -->
    <g fill="#cc4400" opacity="0.25">
      <rect x="104" y="8" width="22" height="4" rx="2"/>
      <rect x="104" y="26" width="22" height="4" rx="2"/>
      <rect x="104" y="44" width="22" height="4" rx="2"/>
      <rect x="104" y="8" width="4" height="22" rx="2"/>
      <rect x="122" y="8" width="4" height="22" rx="2"/>
      <rect x="104" y="26" width="4" height="22" rx="2"/>
      <rect x="122" y="26" width="4" height="22" rx="2"/>
    </g>
    <g fill="#ff6600">
      <rect x="104" y="8" width="22" height="4" rx="2"/>
      <rect x="104" y="8" width="4" height="22" rx="2"/>
      <rect x="122" y="8" width="4" height="22" rx="2"/>
      <rect x="104" y="26" width="22" height="4" rx="2"/>
      <rect x="122" y="26" width="4" height="22" rx="2"/>
      <rect x="104" y="44" width="22" height="4" rx="2"/>
    </g>
  </g>

  <!-- ===== Traces / PCB routes ===== -->
  <g stroke="#2d6a3a" stroke-width="1.2" fill="none" opacity="0.7">
    <polyline points="96,155 115,155 115,165 120,165"/>
    <polyline points="96,170 110,170 110,185 120,185"/>
    <polyline points="240,155 260,155 260,175 290,175"/>
    <polyline points="240,175 265,175 265,175"/>
    <line x1="280" y1="90" x2="290" y2="90"/>
  </g>

  <!-- ===== Clock crystal ===== -->
  <g transform="translate(44, 60)">
    <rect width="28" height="14" rx="3" fill="#d4af37" stroke="#b8960a" stroke-width="1.5"/>
    <text x="14" y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#333">100MHz</text>
    <g fill="#b8960a">
      <rect x="-3" y="4" width="5" height="4" rx="1"/>
      <rect x="26" y="4" width="5" height="4" rx="1"/>
    </g>
  </g>

  <!-- ===== Power regulation chips ===== -->
  <g transform="translate(46, 245)">
    <rect width="36" height="18" rx="3" fill="#2a2a2a" stroke="#555" stroke-width="1.5"/>
    <text x="18" y="12" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">3V3 REG</text>
    <g fill="#888">
      <rect x="-3" y="4" width="5" height="3" rx="1"/>
      <rect x="-3" y="11" width="5" height="3" rx="1"/>
      <rect x="34" y="4" width="5" height="3" rx="1"/>
      <rect x="34" y="11" width="5" height="3" rx="1"/>
    </g>
  </g>

  <!-- ===== Capacitors ===== -->
  <g fill="#c0a060" stroke="#a08040" stroke-width="1">
    <rect x="56" y="205" width="8" height="12" rx="2"/>
    <rect x="70" y="205" width="8" height="12" rx="2"/>
    <rect x="84" y="205" width="8" height="12" rx="2"/>
    <rect x="42" y="205" width="8" height="12" rx="2"/>
  </g>

  <!-- ===== Resistor array ===== -->
  <g transform="translate(40, 170)">
    <rect width="50" height="10" rx="2" fill="#b8860b" stroke="#8b6508" stroke-width="1"/>
    <g fill="#c8a020" stroke="none">
      <rect x="5" y="2" width="5" height="6" rx="1"/>
      <rect x="13" y="2" width="5" height="6" rx="1"/>
      <rect x="21" y="2" width="5" height="6" rx="1"/>
      <rect x="29" y="2" width="5" height="6" rx="1"/>
      <rect x="37" y="2" width="5" height="6" rx="1"/>
    </g>
  </g>

  <!-- ===== Board label ===== -->
