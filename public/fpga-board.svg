  <circle cx="20" cy="20" r="4" fill="#1a3020"/>
  <circle cx="460" cy="20" r="8" fill="#0d2614" stroke="#2d6a3a" stroke-width="1.5"/>
  <circle cx="460" cy="20" r="4" fill="#1a3020"/>
  <circle cx="20" cy="300" r="8" fill="#0d2614" stroke="#2d6a3a" stroke-width="1.5"/>
  <circle cx="20" cy="300" r="4" fill="#1a3020"/>
  <circle cx="460" cy="300" r="8" fill="#0d2614" stroke="#2d6a3a" stroke-width="1.5"/>
  <circle cx="460" cy="300" r="4" fill="#1a3020"/>

  <!-- ===== FPGA Chip (center-left) ===== -->
  <g transform="translate(120, 90)">
